<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Demo 1</title>
  <style>
    img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <img src="images/eifel-tower.jpg" alt="Eiffel Tower" width="460" height="345">
  <p>Resize the browser window to see how the image will scale.</p>
</body>
</html>
